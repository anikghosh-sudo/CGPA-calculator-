<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CGPA Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'IBM Plex Sans', sans-serif;
    background: #EFE9DA;
    color: #242019;
    min-height: 100vh;
    padding: 32px 16px 80px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    margin-bottom: 8px;
  }
  .eyebrow {
    margin: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: #7A7260;
  }
  h1 {
    margin: 2px 0 0;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
  }
  .badge {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    border: 2px solid #8B6A1F;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: #F6F1E4;
  }
  .badge .num {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 26px;
    color: #5C4413;
    line-height: 1;
  }
  .badge .lbl { font-size: 10px; margin-top: 4px; color: #8B7A4C; letter-spacing: 0.03em; }

  .summary { font-size: 13px; color: #5C5647; margin: 0 0 20px; }

  .scale-toggle {
    background: transparent;
    border: 1px solid #C9BFA4;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    color: #5C5647;
    cursor: pointer;
    font-family: inherit;
  }
  .scale-panel {
    margin-top: 12px;
    background: #F6F1E4;
    border: 1px solid #DCD3BB;
    border-radius: 8px;
    padding: 14px 16px;
    display: none;
    grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
    gap: 10px;
  }
  .scale-panel.open { display: grid; }
  .scale-field { display: flex; flex-direction: column; }
  .scale-field label { font-size: 12px; color: #7A7260; margin-bottom: 3px; }
  .scale-field input {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 5px 6px;
    border: 1px solid #C9BFA4;
    border-radius: 4px;
    background: #fff;
    width: 100%;
  }

  .semester {
    background: #F6F1E4;
    border: 1px solid #DCD3BB;
    border-left: 4px solid #8B6A1F;
    border-radius: 8px;
    padding: 16px 18px 14px;
    margin-bottom: 18px;
  }
  .sem-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 10px;
  }
  .sem-name {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 17px;
    border: none;
    background: transparent;
    color: #242019;
    padding: 0;
    width: 55%;
  }
  .sem-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .sgpa {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    color: #5C4413;
    white-space: nowrap;
  }
  .remove-link {
    border: none; background: transparent; color: #A5462A;
    font-size: 13px; cursor: pointer; font-family: inherit;
  }

  .col-head {
    display: grid;
    grid-template-columns: 1fr 62px 84px 70px 24px;
    gap: 8px;
    font-size: 11px;
    color: #8B7A4C;
    padding: 0 2px 6px;
    border-bottom: 1px solid #DCD3BB;
  }
  .course-row {
    display: grid;
    grid-template-columns: 1fr 62px 84px 70px 24px;
    gap: 8px;
    align-items: center;
    padding: 8px 2px;
    border-bottom: 1px solid #EAE3CE;
  }
  .course-row input, .course-row select {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    padding: 5px 6px;
    border: 1px solid #DCD3BB;
    border-radius: 4px;
    background: #fff;
    width: 100%;
    min-width: 0;
  }
  .course-row input[type=number] { font-family: 'IBM Plex Mono', monospace; }
  .qp {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: #5C5647;
  }
  .del-course {
    border: none; background: transparent; color: #A5462A;
    font-size: 16px; cursor: pointer; line-height: 1;
  }

  .add-course {
    margin-top: 10px;
    background: transparent;
    border: 1px dashed #B8AC8A;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    color: #7A7260;
    cursor: pointer;
    font-family: inherit;
  }

  .add-semester {
    width: 100%;
    background: #8B6A1F;
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    color: #F6F1E4;
    cursor: pointer;
    font-family: inherit;
  }

  .footer-note {
    text-align: center;
    font-size: 12px;
    color: #8B7A4C;
    margin-top: 24px;
  }

  @media (max-width: 480px) {
    .col-head, .course-row { grid-template-columns: 1fr 46px 66px 54px 20px; gap: 5px; }
    .badge { width: 76px; height: 76px; }
    .badge .num { font-size: 21px; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div>
      <p class="eyebrow">academic record</p>
      <h1>CGPA calculator</h1>
    </div>
    <div class="badge">
      <span class="num" id="cgpaVal">0.00</span>
      <span class="lbl">CGPA</span>
    </div>
  </div>

  <p class="summary" id="summaryText">0 total credit hours across 1 semester</p>

  <div>
    <button class="scale-toggle" id="scaleToggleBtn">Edit grade scale</button>
    <div class="scale-panel" id="scalePanel"></div>
  </div>

  <div id="semesterList"></div>

  <button class="add-semester" id="addSemesterBtn">+ add semester</button>

  <p class="footer-note">Your data is saved automatically in this browser only.</p>
  <p class="footer-note" style="margin-top: 6px;">&copy; 2026 anikghosh-sudo &mdash; Made with care.</p>
</div>

<script>
let uid = 1;
const nextId = () => uid++;

let scale = [
  { grade: "A+", point: 4.0 },
  { grade: "A",  point: 3.75 },
  { grade: "A-", point: 3.5 },
  { grade: "B+", point: 3.25 },
  { grade: "B",  point: 3.0 },
  { grade: "B-", point: 2.75 },
  { grade: "C+", point: 2.5 },
  { grade: "C",  point: 2.25 },
  { grade: "D",  point: 2.0 },
  { grade: "F",  point: 0.0 },
];

let semesters = [];

function newCourse() {
  return { id: nextId(), name: "", credit: 3, grade: "A" };
}
function newSemester(n) {
  return { id: nextId(), name: "Semester " + n, courses: [newCourse()] };
}

function pointFor(grade) {
  const g = scale.find(s => s.grade === grade);
  return g ? g.point : 0;
}

function save() {
  try {
    localStorage.setItem("cgpa_scale", JSON.stringify(scale));
    localStorage.setItem("cgpa_semesters", JSON.stringify(semesters));
  } catch (e) {}
}

function load() {
  try {
    const s = localStorage.getItem("cgpa_scale");
    const sem = localStorage.getItem("cgpa_semesters");
    if (s) scale = JSON.parse(s);
    if (sem) {
      semesters = JSON.parse(sem);
      let maxId = 0;
      semesters.forEach(se => {
        maxId = Math.max(maxId, se.id);
        se.courses.forEach(c => maxId = Math.max(maxId, c.id));
      });
      uid = maxId + 1;
    }
  } catch (e) {}
  if (!semesters || semesters.length === 0) semesters = [newSemester(1)];
}

function computeAll() {
  let totalCredits = 0, totalQuality = 0;
  const per = semesters.map(sem => {
    let credits = 0, quality = 0;
    sem.courses.forEach(c => {
      const cr = Number(c.credit) || 0;
      credits += cr;
      quality += cr * pointFor(c.grade);
    });
    totalCredits += credits;
    totalQuality += quality;
    return { credits, quality, sgpa: credits > 0 ? quality / credits : 0 };
  });
  const cgpa = totalCredits > 0 ? totalQuality / totalCredits : 0;
  return { per, totalCredits, cgpa };
}

function renderScalePanel() {
  const panel = document.getElementById("scalePanel");
  panel.innerHTML = "";
  scale.forEach(s => {
    const field = document.createElement("div");
    field.className = "scale-field";
    field.innerHTML = `
      <label>${s.grade}</label>
      <input type="number" step="0.01" value="${s.point}" data-grade="${s.grade}" class="scale-input" />
    `;
    panel.appendChild(field);
  });
  panel.querySelectorAll(".scale-input").forEach(inp => {
    inp.addEventListener("input", e => {
      const g = e.target.getAttribute("data-grade");
      const entry = scale.find(x => x.grade === g);
      entry.point = Number(e.target.value);
      save();
      render();
    });
  });
}

function render() {
  const result = computeAll();
  document.getElementById("cgpaVal").textContent = result.cgpa.toFixed(2);
  document.getElementById("summaryText").textContent =
    result.totalCredits + " total credit hours across " + semesters.length +
    " semester" + (semesters.length > 1 ? "s" : "");

  const list = document.getElementById("semesterList");
  list.innerHTML = "";

  semesters.forEach((sem, si) => {
    const res = result.per[si];
    const semDiv = document.createElement("div");
    semDiv.className = "semester";

    const head = document.createElement("div");
    head.className = "sem-head";
    head.innerHTML = `
      <input class="sem-name" value="${escapeHtml(sem.name)}" data-sem="${sem.id}" />
      <div class="sem-actions">
        <span class="sgpa">SGPA ${res.sgpa.toFixed(2)}</span>
        ${semesters.length > 1 ? `<button class="remove-link" data-remove-sem="${sem.id}">remove</button>` : ""}
      </div>
    `;
    semDiv.appendChild(head);

    const colHead = document.createElement("div");
    colHead.className = "col-head";
    colHead.innerHTML = `<span>Course</span><span>Credits</span><span>Grade</span><span>Points</span><span></span>`;
    semDiv.appendChild(colHead);

    sem.courses.forEach(c => {
      const row = document.createElement("div");
      row.className = "course-row";
      const options = scale.map(s => `<option value="${s.grade}" ${s.grade === c.grade ? "selected" : ""}>${s.grade}</option>`).join("");
      row.innerHTML = `
        <input placeholder="Course name" value="${escapeHtml(c.name)}" data-course-name="${c.id}" data-sem-id="${sem.id}" />
        <input type="number" min="0" step="0.5" value="${c.credit}" data-course-credit="${c.id}" data-sem-id="${sem.id}" />
        <select data-course-grade="${c.id}" data-sem-id="${sem.id}">${options}</select>
        <span class="qp">${((Number(c.credit) || 0) * pointFor(c.grade)).toFixed(2)}</span>
        <button class="del-course" data-remove-course="${c.id}" data-sem-id="${sem.id}" aria-label="Remove course">&times;</button>
      `;
      semDiv.appendChild(row);
    });

    const addBtn = document.createElement("button");
    addBtn.className = "add-course";
    addBtn.textContent = "+ add course";
    addBtn.setAttribute("data-add-course", sem.id);
    semDiv.appendChild(addBtn);

    list.appendChild(semDiv);
  });

  attachListeners();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function attachListeners() {
  document.querySelectorAll("[data-sem]").forEach(inp => {
    inp.addEventListener("input", e => {
      const semId = Number(e.target.getAttribute("data-sem"));
      const sem = semesters.find(s => s.id === semId);
      sem.name = e.target.value;
      save();
    });
  });

  document.querySelectorAll("[data-remove-sem]").forEach(btn => {
    btn.addEventListener("click", e => {
      const semId = Number(e.target.getAttribute("data-remove-sem"));
      if (semesters.length > 1) {
        semesters = semesters.filter(s => s.id !== semId);
        save();
        render();
      }
    });
  });

  document.querySelectorAll("[data-course-name]").forEach(inp => {
    inp.addEventListener("input", e => {
      const cId = Number(e.target.getAttribute("data-course-name"));
      const semId = Number(e.target.getAttribute("data-sem-id"));
      const sem = semesters.find(s => s.id === semId);
      const c = sem.courses.find(x => x.id === cId);
      c.name = e.target.value;
      save();
    });
  });

  document.querySelectorAll("[data-course-credit]").forEach(inp => {
    inp.addEventListener("input", e => {
      const cId = Number(e.target.getAttribute("data-course-credit"));
      const semId = Number(e.target.getAttribute("data-sem-id"));
      const sem = semesters.find(s => s.id === semId);
      const c = sem.courses.find(x => x.id === cId);
      c.credit = e.target.value;
      save();
      render();
    });
  });

  document.querySelectorAll("[data-course-grade]").forEach(sel => {
    sel.addEventListener("change", e => {
      const cId = Number(e.target.getAttribute("data-course-grade"));
      const semId = Number(e.target.getAttribute("data-sem-id"));
      const sem = semesters.find(s => s.id === semId);
      const c = sem.courses.find(x => x.id === cId);
      c.grade = e.target.value;
      save();
      render();
    });
  });

  document.querySelectorAll("[data-remove-course]").forEach(btn => {
    btn.addEventListener("click", e => {
      const cId = Number(e.target.getAttribute("data-remove-course"));
      const semId = Number(e.target.getAttribute("data-sem-id"));
      const sem = semesters.find(s => s.id === semId);
      if (sem.courses.length > 1) {
        sem.courses = sem.courses.filter(c => c.id !== cId);
        save();
        render();
      }
    });
  });

  document.querySelectorAll("[data-add-course]").forEach(btn => {
    btn.addEventListener("click", e => {
      const semId = Number(e.target.getAttribute("data-add-course"));
      const sem = semesters.find(s => s.id === semId);
      sem.courses.push(newCourse());
      save();
      render();
    });
  });
}

document.getElementById("addSemesterBtn").addEventListener("click", () => {
  semesters.push(newSemester(semesters.length + 1));
  save();
  render();
});

document.getElementById("scaleToggleBtn").addEventListener("click", () => {
  const panel = document.getElementById("scalePanel");
  panel.classList.toggle("open");
  document.getElementById("scaleToggleBtn").textContent =
    panel.classList.contains("open") ? "Hide grade scale" : "Edit grade scale";
});

load();
renderScalePanel();
render();
</script>

</body>
</html>
